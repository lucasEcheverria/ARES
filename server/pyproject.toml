[project]
name = "ares-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "asyncmy>=0.2.11",
    "fastapi>=0.139.0",
    "google-auth>=2.55.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "elasticsearch>=9.4.0",
    "uvicorn[standard]>=0.50.2",
    "zeroconf>=0.151.3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
